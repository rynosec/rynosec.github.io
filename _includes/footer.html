          {% endif %}
        </p>
      </div>

     <div class="footer-right">
        <p class="mb-0">
          <!-- 720922 -->
          Made with ❤️ and some ☕
        </p>
      </div>

    </div>
  </div>
</footer>
<link rel="stylesheet" href="{{ '/assets/css/now-playing.css' | relative_url }}">
<script defer src="{{ '/assets/js/now-playing.js' | relative_url }}"></script>
<script>
  (() => {
    const MOBILE_BREAKPOINT = '(max-width: 1199.98px)';

    const shouldRun = () => {
      if (!window.matchMedia(MOBILE_BREAKPOINT).matches) return false;
      const rawPath = window.location.pathname || '/';
      const path = rawPath.replace(/\/+$/, '') || '/';
      return path === '/' || path === '/index.html';
    };

    const openSidebar = () => {
      if (!shouldRun()) return;

      const trigger = document.getElementById('sidebar-trigger');
      const sidebar = document.getElementById('sidebar');
      const mask = document.getElementById('mask');
      if (!sidebar || !mask) return;

      // Prefer official toggle when available
      if (!document.body.hasAttribute('sidebar-display') && trigger) {
        trigger.click();
      }

      // Fallback: force state in case handlers were not attached
      if (!document.body.hasAttribute('sidebar-display')) {
        document.body.setAttribute('sidebar-display', '');
        sidebar.classList.add('z-2');
        mask.classList.remove('d-none');
      }
    };

    const scheduleOpens = () => {
      // Run multiple times because Chirpy deferred scripts can override early state.
      openSidebar();
      setTimeout(openSidebar, 250);
      setTimeout(openSidebar, 900);
    };

    window.addEventListener('load', scheduleOpens, { once: true });
    window.addEventListener('pageshow', scheduleOpens, { once: true });
  })();
</script>
