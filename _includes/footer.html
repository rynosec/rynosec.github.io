<link rel="stylesheet" href="{{ '/assets/css/now-playing.css' | relative_url }}">
<script defer src="{{ '/assets/js/now-playing.js' | relative_url }}"></script>
<script>
  (() => {
    const MOBILE_BREAKPOINT = '(max-width: 1199.98px)';

    const shouldRun = () => {
      if (!window.matchMedia(MOBILE_BREAKPOINT).matches) return false;
      const rawPath = window.location.pathname || '/';
      const path = rawPath.replace(/\/+$/, '') || '/';
      return path === '/' || path === '/index.html'; // homepage only
    };

    const forceOpenSidebar = () => {
      if (!shouldRun()) return;
      if (document.body.hasAttribute('sidebar-display')) return;

      const sidebar = document.getElementById('sidebar');
      const mask = document.getElementById('mask');
      if (!sidebar || !mask) return;

      document.body.setAttribute('sidebar-display', '');
      sidebar.classList.add('z-2');
      mask.classList.remove('d-none');
    };

    const openWithRetry = () => {
      let tries = 0;
      const maxTries = 20;
      const tick = () => {
        tries += 1;
        forceOpenSidebar();
        if (document.body.hasAttribute('sidebar-display') || tries >= maxTries) return;
        setTimeout(tick, 120);
      };
      tick();
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', openWithRetry, { once: true });
    } else {
      openWithRetry();
    }

    window.addEventListener('pageshow', openWithRetry, { once: true });
  })();
</script>
